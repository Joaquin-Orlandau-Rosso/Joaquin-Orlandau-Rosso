name: Viborita de contribuciones

on:
  # Se regenera sola todos los días, a mano desde Actions o con cada push a main.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar la viborita
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#b04a2b&color_dots=#ebedf0,#bfe3e7,#6cc0ca,#0e6e7a,#08454d
            dist/snake-dark.svg?palette=github-dark&color_snake=#e8876b&color_dots=#161b22,#0b4a52,#0e6e7a,#2fa3b1,#6fd3df

      - name: Publicarla en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
