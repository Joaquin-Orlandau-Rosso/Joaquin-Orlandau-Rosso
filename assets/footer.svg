<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-label="Gracias por pasar  ·  Thanks for stopping by">
<style>@font-face{font-family:'HG';font-weight:500;src:url(data:font/ttf;base64,) format('truetype')}
text{font-family:'HG','Hanken Grotesk','Segoe UI',Helvetica,Arial,sans-serif}
.w0{animation:w0 16s linear infinite}@keyframes w0{from{transform:translateX(-600px)}to{transform:translateX(0px)}}
.w1{animation:w1 12s linear infinite}@keyframes w1{from{transform:translateX(0px)}to{transform:translateX(-420px)}}
.w2{animation:w2 21s linear infinite}@keyframes w2{from{transform:translateX(-800px)}to{transform:translateX(0px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><clipPath id="clip"><rect width="1200" height="130" rx="20"/></clipPath></defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="130" fill="#16130e"/>
  <g transform="translate(0 130) scale(1 -1)">
  <path class="w0" d="M0 76 Q150 58 300 76 T600 76 T900 76 T1200 76 T1500 76 T1800 76 T2100 76 V130 H0 Z" fill="#0e6e7a" fill-opacity="0.6"/>
  <path class="w1" d="M0 92 Q105 79 210 92 T420 92 T630 92 T840 92 T1050 92 T1260 92 T1470 92 T1680 92 V130 H0 Z" fill="#b04a2b" fill-opacity="0.55"/>
  <path class="w2" d="M0 108 Q200 93 400 108 T800 108 T1200 108 T1600 108 T2000 108 T2400 108 V130 H0 Z" fill="#e8876b" fill-opacity="0.3"/>
  </g>
  <text x="600" y="102" text-anchor="middle" font-size="16" font-weight="500" letter-spacing=".3" fill="#a39987">Gracias por pasar  ·  Thanks for stopping by</text>
</g>
</svg>