<svg xmlns="http://www.w3.org/2000/svg" width="900" height="206" viewBox="0 0 900 206" role="img" aria-label="Logros de GitHub: Pull Shark, Quickdraw, YOLO">
<title>Logros de GitHub</title>
<style>@font-face{font-family:'HG';font-weight:500;src:url(data:font/ttf;base64,) format('truetype')}@font-face{font-family:'HG';font-weight:700;src:url(data:font/ttf;base64,) format('truetype')}
text{font-family:'HG','Hanken Grotesk','Segoe UI',Helvetica,Arial,sans-serif}
.in{animation:in .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ring{animation:pulse 3.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1;stroke-width:2.6}}
.shine{animation:shine 6s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-200px)}60%,100%{transform:translateX(960px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
  <clipPath id="c"><rect width="900" height="206" rx="16"/></clipPath>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.1" fill="#faf7f1" fill-opacity=".06"/></pattern>
  <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#faf7f1" stop-opacity="0"/><stop offset=".5" stop-color="#faf7f1" stop-opacity=".5"/><stop offset="1" stop-color="#faf7f1" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#c)">
  <rect width="900" height="206" fill="#16130e"/>
  <rect width="900" height="206" fill="url(#dots)"/>
  <rect width="900" height="3" fill="#0e6e7a" fill-opacity=".7"/>
  <rect class="shine" width="160" height="3" fill="url(#sh)"/>
  <g class="in" style="animation-delay:0.15s">
    <circle cx="150" cy="86" r="47" fill="none" stroke="#0e6e7a" stroke-opacity=".25" stroke-width="2"/>
    <circle class="ring" cx="150" cy="86" r="40" fill="#0e6e7a" fill-opacity=".12" stroke="#5cc8d4" stroke-opacity=".8" stroke-width="2" style="transform-origin:150px 86px;animation-delay:0.0s"/>
    <g transform="translate(132 68) scale(1.5)"><path d="M2 17c6 0 7-1 10-1 .5-4 2.5-9 6-11-1 3-1 5 0 7 2 .4 3.5 1.6 4 4-2 0-3-1-4.5-1C15 17 11 19 6 19c-1.5 0-3-.7-4-2z" fill="#5cc8d4"/><circle cx="17" cy="11.5" r="1" fill="#16130e"/><path d="M2 20c2-1.4 4-1.4 6 0" fill="none" stroke="#5cc8d4" stroke-width="1.6" stroke-linecap="round" opacity=".6"/></g>
    <text x="150" y="160" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="-.2" fill="#faf7f1">Pull Shark</text>
    <text x="150" y="182" text-anchor="middle" font-size="12.5" font-weight="500" fill="#a39987">PRs mergeados</text>
  </g>
  <g class="in" style="animation-delay:0.33s">
    <circle cx="450" cy="86" r="47" fill="none" stroke="#b04a2b" stroke-opacity=".25" stroke-width="2"/>
    <circle class="ring" cx="450" cy="86" r="40" fill="#b04a2b" fill-opacity=".12" stroke="#f0a088" stroke-opacity=".8" stroke-width="2" style="transform-origin:450px 86px;animation-delay:0.5s"/>
    <g transform="translate(432 68) scale(1.5)"><circle cx="12" cy="13.5" r="7.5" fill="none" stroke="#f0a088" stroke-width="2"/><path d="M9.5 2.5h5M12 2.5v2.4M18 7l1.4-1.4M12 13.5V9.5" fill="none" stroke="#f0a088" stroke-width="2" stroke-linecap="round"/></g>
    <text x="450" y="160" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="-.2" fill="#faf7f1">Quickdraw</text>
    <text x="450" y="182" text-anchor="middle" font-size="12.5" font-weight="500" fill="#a39987">Issue cerrado en &lt; 5 min</text>
  </g>
  <g class="in" style="animation-delay:0.51s">
    <circle cx="750" cy="86" r="47" fill="none" stroke="#b88a2e" stroke-opacity=".25" stroke-width="2"/>
    <circle class="ring" cx="750" cy="86" r="40" fill="#b88a2e" fill-opacity=".12" stroke="#edc968" stroke-opacity=".8" stroke-width="2" style="transform-origin:750px 86px;animation-delay:1.0s"/>
    <g transform="translate(732 68) scale(1.5)"><rect x="4" y="4" width="16" height="16" rx="4" fill="#edc968"/><g fill="#16130e"><circle cx="9" cy="9" r="1.5"/><circle cx="15" cy="9" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="9" cy="15" r="1.5"/><circle cx="15" cy="15" r="1.5"/></g></g>
    <text x="750" y="160" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="-.2" fill="#faf7f1">YOLO</text>
    <text x="750" y="182" text-anchor="middle" font-size="12.5" font-weight="500" fill="#a39987">Merge sin review</text>
  </g>
</g>
<rect x=".5" y=".5" width="899" height="205" rx="15.5" fill="none" stroke="#faf7f1" stroke-opacity=".1"/>
</svg>